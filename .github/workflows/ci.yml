name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore Project_Tracker_Backend/Project_Tracker_Backend.csproj

      - name: Build Backend (Release)
        run: dotnet build Project_Tracker_Backend/Project_Tracker_Backend.csproj --configuration Release --no-restore

      - name: Run Backend Tests
        run: dotnet test Project_Tracker_Backend.test/Project_Tracker_Backend.test.csproj --configuration Release

  frontend-ci:
    name: Frontend Lint & Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Build Frontend
        run: npm run build
